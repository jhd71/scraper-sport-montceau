name: Update FC Montceau Sport Data

on:
  schedule:
    # Tous les jours à 7h UTC (9h Paris)
    - cron: '0 7 * * *'
    # Samedi 19h UTC (21h Paris) - résultats des matchs de fin d'après-midi
    - cron: '0 19 * * 6'
    # Samedi 22h UTC (minuit Paris) - résultats en soirée
    - cron: '0 22 * * 6'
    # Dimanche 17h UTC (19h Paris) - résultats du dimanche après-midi
    - cron: '0 17 * * 0'
    # Dimanche 5h UTC (7h Paris) - filet de sécurité du week-end
    - cron: '0 5 * * 0'
  workflow_dispatch: # Exécution manuelle

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: 'Europe/Paris'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run sport scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node update-sport.js
        
        
      - name: Run basket scraper
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node update-basket.js