name: Update FC Montceau Sport Data

on:
  schedule:
    # Tous les jours à 7h UTC (9h Paris)
    - cron: '0 7 * * *'
    # Dimanche à 5h UTC (7h Paris) - résultats du samedi soir
    - cron: '0 5 * * 0'
    # Samedi à 22h UTC (minuit Paris) - résultats en soirée
    - cron: '0 22 * * 6'
  workflow_dispatch: # Exécution manuelle

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: 'Europe/Paris'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run sport scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node update-sport.js
