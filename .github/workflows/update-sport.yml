name: Update FC Montceau Sport Data

on:
  schedule:
    # ATTENTION : heures en UTC. Paris = UTC+1 en hiver, UTC+2 en été.
    # Chaque passage lance le foot ET le basket.

    # Tous les jours : 8h27 Paris (hiver) / 9h27 (été)
    - cron: '27 7 * * *'

    # SAMEDI
    # 20h27 Paris (hiver) / 21h27 (été) - foot de 18h
    - cron: '27 19 * * 6'
    # 21h27 Paris (hiver) / 22h27 (été) - foot si score en retard
    - cron: '27 20 * * 6'
    # 22h47 Paris (hiver) / 23h47 (été) - basket masculin de 20h
    - cron: '47 21 * * 6'
    # 23h47 Paris (hiver) / 0h47 (été) - basket si feuille de match en retard
    - cron: '47 22 * * 6'

    # DIMANCHE
    # 6h17 Paris (hiver) / 7h17 (été) - filet de sécurité du samedi
    - cron: '17 5 * * 0'
    # 17h27 Paris (hiver) / 18h27 (été) - foot de 15h
    - cron: '27 16 * * 0'
    # 18h27 Paris (hiver) / 19h27 (été) - basket de l'après-midi
    - cron: '27 17 * * 0'
    # 19h47 Paris (hiver) / 20h47 (été) - si score en retard
    - cron: '47 18 * * 0'
  workflow_dispatch: # Exécution manuelle

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: 'Europe/Paris'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run sport scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node update-sport.js
        
        
      - name: Run basket scraper
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node update-basket.js